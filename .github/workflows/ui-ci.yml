name: UI CI

on:
  pull_request:
    paths:
      - ".github/workflows/ui-ci.yml"
      - "src/**"
      # Contract tests and captured wire fixtures live outside `src/**`
      # (RUK-254). Without this line a PR that only updates a fixture — the
      # exact artifact the drift mechanism relies on — skips CI entirely.
      - "tests/**"
      - "public/**"
      - "scripts/**"
      - "deployment/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "vitest*.config.ts"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  verify:
    name: Lint, contracts, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Type-checks test files too, which `next build` does not: it only covers
      # what the app graph reaches, and vitest transpiles without checking.
      # Placed here so a type error fails before the slower steps.
      - run: npm run typecheck
      # `npm run format` (prettier --check) is intentionally NOT a gate yet —
      # the tree has pre-existing style drift. Re-add once it's clean.
      # `test:contracts` used to BE this boundary linter; it was renamed
      # (RUK-254) because the old name implied FE↔BE contract coverage that did
      # not exist. Both run here — dropping either silently reopens a gap.
      - run: npm run test:boundaries
      - run: npm run test:contracts
      - run: npm run test:unit
      # Build with the same placeholder build-time env the Dockerfile uses, so
      # the page-data collection step (which initializes the NextAuth config
      # and validates its env) passes. Real values come from --env-file at run.
      - run: npm run build
        env:
          MAINTMODE_AUTH_SECRET: build-time-placeholder-secret-32chars-min
          MAINTMODE_APP_BASE_URL: http://localhost:3000
          MAINTMODE_GOOGLE_OAUTH_CLIENT_ID: build-time-placeholder
          MAINTMODE_GOOGLE_OAUTH_CLIENT_SECRET: build-time-placeholder
      # Must follow `build`: it reads the RSC manifests out of `.next/`. Fails
      # when a heavy dependency (FullCalendar, luxon, cmdk, react-day-picker)
      # becomes reachable through a route's synchronous import graph.
      - run: npm run test:bundle

  image:
    name: Build image (ui)
    runs-on: ubuntu-latest
    # Publish only on main/tag pushes, not PRs (PRs just run verify above).
    if: github.event_name != 'pull_request'
    needs:
      - verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/ui
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/.build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  # NOTE: deploys are manual only (maintmode-deploy → Actions → "Deploy dev",
  # pick services). The UI CI just publishes the image to GHCR; it does not
  # trigger a deploy.
