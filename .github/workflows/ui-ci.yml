name: UI CI

on:
  pull_request:
    paths:
      - ".github/workflows/ui-ci.yml"
      - "src/**"
      # Contract tests and captured wire fixtures live outside `src/**`
      # (RUK-254). Without this line a PR that only updates a fixture — the
      # exact artifact the drift mechanism relies on — skips CI entirely.
      - "tests/**"
      - "public/**"
      - "scripts/**"
      - "deployment/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - "vitest*.config.ts"
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  # Split into separate jobs so a red run names what broke on the run list
  # itself, and so the slow ones stop queueing behind the fast ones. Each job
  # pays its own `npm ci`, which the npm cache makes cheap next to the wall
  # clock the parallelism buys back.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Type-checks test files too, which `next build` does not: it only covers
      # what the app graph reaches, and vitest transpiles without checking.
      - run: npm run typecheck
      # Kept in the same order as the `verify` script so a green local `verify`
      # means a green CI run — while this step was missing here, style drift
      # failed `verify` before it ever reached `build`, yet CI on the same
      # commit passed (RUK-271).
      - run: npm run format

  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `test:contracts` used to BE this boundary linter; it was renamed
      # (RUK-254) because the old name implied FE↔BE contract coverage that did
      # not exist. Both run here — dropping either silently reopens a gap.
      - run: npm run test:boundaries
      - run: npm run test:contracts

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build with the same placeholder build-time env the Dockerfile uses, so
      # the page-data collection step (which initializes the NextAuth config
      # and validates its env) passes. Real values come from --env-file at run.
      - run: npm run build
        env:
          MAINTMODE_AUTH_SECRET: build-time-placeholder-secret-32chars-min
          MAINTMODE_APP_BASE_URL: http://localhost:3000
          MAINTMODE_GOOGLE_OAUTH_CLIENT_ID: build-time-placeholder
          MAINTMODE_GOOGLE_OAUTH_CLIENT_SECRET: build-time-placeholder
      # Stays in this job rather than one of its own: it reads the RSC manifests
      # out of `.next/`, so it needs the build that just ran. Fails when a heavy
      # dependency (FullCalendar, luxon, cmdk, react-day-picker) becomes
      # reachable through a route's synchronous import graph.
      - run: npm run test:bundle

  image:
    name: Build image (ui)
    runs-on: ubuntu-latest
    # Publish only on main/tag pushes, not PRs (PRs just run the checks above).
    if: github.event_name != 'pull_request'
    needs:
      - lint
      - contracts
      - unit
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Registers binfmt handlers so buildx can run the arm64 stages on an
      # amd64 runner. Without it a multi-platform build fails on the first RUN.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/maintmode-ui
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/.build/Dockerfile
          # Both architectures: an operator self-hosting on an ARM Mac cannot
          # pull an amd64-only image. The build runs once per platform, which
          # roughly doubles this job — the GHA cache below absorbs most of it.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  # NOTE: deploys are manual only (maintmode-deploy → Actions → "Deploy dev",
  # pick services). The UI CI just publishes the image to GHCR; it does not
  # trigger a deploy.
